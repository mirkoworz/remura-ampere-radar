name: Radar Node and isolated CAS LAB
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: radar-global
  cancel-in-progress: false
jobs:
  node-offline:
    if: github.repository == 'mirkoworz/remura-ampere-radar' && github.ref == 'refs/heads/main' && github.actor == 'mirkoworz' && github.triggering_actor == 'mirkoworz'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify pinned LAB source without secrets
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          expected=03fab01cbadfe80c798bbd376ae8f48fdf6ccd88
          git init lab
          cd lab
          git -c credential.helper= fetch --depth=1 https://github.com/mirkoworz/remura-ampere-radar.git "$expected"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$expected"
          node -e 'if (+process.versions.node.split(".")[0] < 22) process.exit(1)'
          node cycle-test.mjs
  cas-isolated:
    needs: node-offline
    if: github.repository == 'mirkoworz/remura-ampere-radar' && github.ref == 'refs/heads/main' && github.actor == 'mirkoworz' && github.triggering_actor == 'mirkoworz'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Isolated CAS prepare and independent restart
        shell: bash
        env:
          RADAR_TOKEN: ${{ secrets.RADAR_STATE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/check.py" <<'PY'
          import base64, json, os, re, sys, urllib.request, urllib.error
          URL = "https://api.github.com/repos/mirkoworz/remura-radar-state/contents/cas-lab.json"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          def req(method, payload=None):
              token = os.environ.get("RADAR_TOKEN", "")
              if not token or any(c.isspace() for c in token):
                  raise ValueError("config")
              if method not in ("GET", "PUT"):
                  raise ValueError("method")
              url = URL + ("?ref=main" if method == "GET" else "")
              data = None if payload is None else json.dumps(payload).encode()
              r = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json",
                  "User-Agent": "remura-isolated-cas-lab"})
              try:
                  with urllib.request.build_opener(NoRedirect()).open(r, timeout=15) as f:
                      raw = f.read(65537)
                      if len(raw) > 65536:
                          raise ValueError("size")
                      return f.status, json.loads(raw)
              except urllib.error.HTTPError as e:
                  code = e.code
                  e.close()
                  return code, {}
          def sha_ok(s):
              return isinstance(s, str) and re.fullmatch("[0-9a-f]{40}", s) is not None
          def read():
              status, b = req("GET")
              if status != 200 or not sha_ok(b.get("sha")) or b.get("type") != "file" or b.get("name") != "cas-lab.json" or b.get("encoding") != "base64":
                  raise ValueError("read")
              raw = base64.b64decode(b["content"].replace("\n", ""), validate=True)
              if len(raw) > 4096:
                  raise ValueError("size")
              s = json.loads(raw)
              if (s.get("schema") != 1 or s.get("purpose") != "isolated-cas-lab" or s.get("enabled") is not False
                  or type(s.get("revision")) is not int or not 0 <= s["revision"] < 1000000
                  or s.get("phase") not in ("idle", "prepared", "complete")):
                  raise ValueError("schema")
              return b["sha"], s
          def put(sha, s):
              if not sha_ok(sha) or s.get("enabled") is not False:
                  raise ValueError("write gate")
              return req("PUT", {"branch":"main","message":"Isolated CAS diagnostic",
                  "sha":sha,"content":base64.b64encode((json.dumps(s,sort_keys=True)+"\n").encode()).decode()})
          def confirm(status, body, prior, expected):
              version = body.get("content", {}).get("sha")
              if status != 200 or not sha_ok(version) or version == prior:
                  raise ValueError("uncertain write")
              seen, value = read()
              if seen != version or value != expected:
                  raise ValueError("uncertain reread")
              return seen
          def main():
              run = os.environ["GITHUB_RUN_ID"] + ":" + os.environ["GITHUB_RUN_ATTEMPT"]
              if not re.fullmatch(r"[0-9]+:[0-9]+", run):
                  raise ValueError("run")
              version, state = read()
              if sys.argv[1] == "prepare":
                  if state["phase"] not in ("idle", "complete"):
                      raise ValueError("previous claim requires review")
                  next_state = {**state,"revision":state["revision"]+1,"phase":"prepared","run":run,"previous":version}
                  status, body = put(version, next_state)
                  confirm(status, body, version, next_state)
                  print("CAS_LAB_PREPARED")
              elif sys.argv[1] == "resume":
                  if state["phase"] != "prepared" or state.get("run") != run or not sha_ok(state.get("previous")) or state["previous"] == version:
                      raise ValueError("unexpected intent")
                  next_state = {**state,"revision":state["revision"]+1,"phase":"complete"}
                  status, _ = put(state["previous"], next_state)
                  if status != 409:
                      raise ValueError("stale CAS not rejected with conflict")
                  seen, value = read()
                  if seen != version or value != state:
                      raise ValueError("conflict changed fixture")
                  print("CAS_LAB_STALE_REJECTED")
                  status, body = put(version, next_state)
                  confirm(status, body, version, next_state)
                  print("CAS_LAB_RESTART_OK_DISABLED")
              else:
                  raise ValueError("mode")
          try:
              main()
          except Exception:
              print("CAS_LAB_STOP_REVIEW_REQUIRED", file=sys.stderr)
              sys.exit(1)
          PY
          python3 "$tmp/check.py" prepare
          python3 "$tmp/check.py" resume
