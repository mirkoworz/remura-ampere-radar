name: Radar OCI single live LAB
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Explicit approval: enter CAPACITY_ONLY_ONCE (one report, no provisioning)'
        required: true
        type: string
permissions: {}
concurrency:
  group: radar-global
  cancel-in-progress: false
jobs:
  capacity-only:
    if: github.repository == 'mirkoworz/remura-ampere-radar' && github.ref == 'refs/heads/main' && github.actor == 'mirkoworz' && github.triggering_actor == 'mirkoworz' && github.run_attempt == 1 && inputs.confirm == 'CAPACITY_ONLY_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve and verify exact reviewed source without secrets
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          expected=e1a40f78a88e7262ba6d1b8817b17edd36dd3211
          git init lab
          cd lab
          git -c credential.helper= fetch --depth=1 https://github.com/mirkoworz/remura-ampere-radar.git "$expected"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$expected"
          node -e 'if (+process.versions.node.split(".")[0] < 22) process.exit(1)'
          node cycle-test.mjs
      - name: One signed capacity report, sanitized result only
        shell: bash
        env:
          RADAR_LIVE_GATE: CAPACITY_ONLY_ONCE
          RADAR_OCI_TENANCY: ${{ secrets.RADAR_OCI_TENANCY }}
          RADAR_OCI_USER: ${{ secrets.RADAR_OCI_USER }}
          RADAR_OCI_FINGERPRINT: ${{ secrets.RADAR_OCI_FINGERPRINT }}
          RADAR_OCI_AD: ${{ secrets.RADAR_OCI_AD }}
          RADAR_OCI_PRIVATE_KEY: ${{ secrets.RADAR_OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cd lab
          test "$(git rev-parse HEAD)" = e1a40f78a88e7262ba6d1b8817b17edd36dd3211
          node oci-live-lab.mjs
