name: Radar OCI credential preflight LAB
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: radar-global
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'mirkoworz/remura-ampere-radar' && github.ref == 'refs/heads/main' && github.actor == 'mirkoworz' && github.triggering_actor == 'mirkoworz'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate OCI credentials locally without network or disclosure
        shell: bash
        env:
          RADAR_OCI_TENANCY: ${{ secrets.RADAR_OCI_TENANCY }}
          RADAR_OCI_USER: ${{ secrets.RADAR_OCI_USER }}
          RADAR_OCI_FINGERPRINT: ${{ secrets.RADAR_OCI_FINGERPRINT }}
          RADAR_OCI_AD: ${{ secrets.RADAR_OCI_AD }}
          RADAR_OCI_PRIVATE_KEY: ${{ secrets.RADAR_OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createPrivateKey,createPublicKey,createHash,sign,verify} from "node:crypto";
          let passed=true;
          const report=(name,result)=>{console.log("PREFLIGHT_"+name+"_"+(result?"OK":"FAIL"));if(!result)passed=false;};
          const tenancy=process.env.RADAR_OCI_TENANCY??"";
          const user=process.env.RADAR_OCI_USER??"";
          const fp=process.env.RADAR_OCI_FINGERPRINT??"";
          const ad=process.env.RADAR_OCI_AD??"";
          const pem=process.env.RADAR_OCI_PRIVATE_KEY??"";
          report("TENANCY_FORMAT",/^ocid1\.tenancy\.oc1\.\.[a-z0-9]{10,100}$/.test(tenancy));
          report("USER_FORMAT",/^ocid1\.user\.oc1\.\.[a-z0-9]{10,100}$/.test(user));
          const fpOk=/^([a-f0-9]{2}:){15}[a-f0-9]{2}$/i.test(fp);
          report("FINGERPRINT_FORMAT",fpOk);
          report("AD_FORMAT",/^[A-Za-z0-9]{4}:EU-MILAN-1-AD-1$/.test(ad));
          let key=null,pub=null;
          try{
            if(pem.length>16384||!pem)throw Error("key");
            key=createPrivateKey(pem);
            if(key.asymmetricKeyType!=="rsa"||key.asymmetricKeyDetails.modulusLength<2048)throw Error("rsa");
            pub=createPublicKey(key);
          }catch{key=null;pub=null;}
          report("RSA_KEY",!!key);
          if(key&&fpOk){
            try{
              const computed=createHash("md5").update(pub.export({type:"spki",format:"der"})).digest("hex").match(/../g).join(":");
              report("FINGERPRINT_MATCH",computed===fp.toLowerCase());
            }catch{report("FINGERPRINT_CHECK_AVAILABLE",false);}
          }else{report("FINGERPRINT_MATCH",false);}
          if(key){
            try{
              const msg=Buffer.from("REMURA OCI preflight synthetic challenge");
              report("RSA_SIGN_VERIFY",verify("RSA-SHA256",msg,pub,sign("RSA-SHA256",msg,key)));
            }catch{report("RSA_SIGN_VERIFY",false);}
          }else{report("RSA_SIGN_VERIFY",false);}
          console.log(passed?"PREFLIGHT_ALL_OK_NO_NETWORK":"PREFLIGHT_STOP_NO_NETWORK");
          if(!passed)process.exitCode=1;
          JS
